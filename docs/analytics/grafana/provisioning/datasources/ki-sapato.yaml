apiVersion: 1
datasources:
  - name: Ki Sapato (BI)
    uid: ki-sapato-bi
    type: postgres
    access: proxy
    url: ${KI_SAPATO_BI_HOST}:5432
    user: bi_reader
    secureJsonData:
      password: ${KI_SAPATO_BI_PASSWORD}
    jsonData:
      database: ${KI_SAPATO_BI_DATABASE}
      sslmode: require
      postgresVersion: 1700
      timescaledb: false
